<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Masuk - Sistem POS</title>
    <link rel="stylesheet" href="/css/login.css" />
  </head>
  <body>
    <div class="box">
      <h1>Sistem POS Multi-Outlet</h1>
      <p class="sub">
        Kelola penjualan & stok terpusat — masuk sesuai peran Anda
      </p>
      <div id="alertMsg" class="alert"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Nama Pengguna</label
          ><input
            id="username"
            required
            placeholder="admin / manager / cashier"
          />
        </div>
        <div class="form-group">
          <label for="password">Kata Sandi</label
          ><input
            type="password"
            id="password"
            required
            placeholder="password123"
          />
        </div>
        <button class="btn" type="submit">Masuk</button>
        <div class="loading" id="loading">Memverifikasi…</div>
      </form>
    </div>
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          var username = document.getElementById("username").value;
          var password = document.getElementById("password").value;
          var alertMsg = document.getElementById("alertMsg");
          var loading = document.getElementById("loading");
          loading.style.display = "block";
          alertMsg.classList.remove("show");
          try {
            var res = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username: username, password: password }),
            });
            if (!res.ok) {
              console.log("API gagal, coba mock");
              res = await fetch("/api/auth/login-mock", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  username: username,
                  password: password,
                }),
              });
            }
            if (res.ok) {
              var data = await res.json();
              localStorage.setItem("accessToken", data.accessToken);
              localStorage.setItem(
                "username",
                data.user ? data.user.username : username,
              );
              localStorage.setItem(
                "userRole",
                data.user
                  ? data.user.role
                  : username === "admin"
                    ? "super_admin"
                    : username,
              );
              try {
                localStorage.setItem("user", JSON.stringify(data.user));
              } catch (e) {}
              var role =
                (data.user && data.user.role) ||
                (username === "admin"
                  ? "super_admin"
                  : username === "manager"
                    ? "manager"
                    : "cashier");
              if (role === "super_admin") location.href = "/admin.html";
              else if (role === "cashier") location.href = "/index.html";
              else location.href = "/products.html";
            } else {
              var err = await res.json();
              alertMsg.textContent = err.error || "Gagal masuk";
              alertMsg.classList.add("show");
            }
          } catch (ex) {
            console.error(ex);
            alertMsg.textContent = "Koneksi gagal. Masuk mode demo…";
            alertMsg.classList.add("show");
            setTimeout(function () {
              localStorage.setItem("accessToken", "demo_" + Date.now());
              localStorage.setItem("username", username);
              localStorage.setItem(
                "userRole",
                username === "admin" ? "super_admin" : username,
              );
              location.href =
                username === "admin"
                  ? "/admin.html"
                  : username === "manager"
                    ? "/products.html"
                    : "/index.html";
            }, 900);
          } finally {
            loading.style.display = "none";
          }
        });
    </script>
  </body>
</html>
